    <script>
        class UsersManager {
            constructor() {
                this.users = [];
                this.filteredUsers = [];
                this.currentPage = 1;
                this.itemsPerPage = 12;
                this.currentUserId = null;
                this.apiBase = 'http://localhost:3000/api';
                this.token = localStorage.getItem('token');
                this.currentUser = null;
                
                this.init();
            }

            init() {
                this.checkAuth();
                this.bindEvents();
                this.loadUsers();
            }

            checkAuth() {
                const token = localStorage.getItem('token');
                const userStr = localStorage.getItem('user');
                
                if (!token || !userStr) {
                    this.redirectToLogin();
                    return;
                }
                
                try {
                    this.currentUser = JSON.parse(userStr);
                    if (this.currentUser.role !== 'administrateur') {
                        this.redirectToDashboard();
                        return;
                    }
                } catch (error) {
                    console.error('Erreur lors de la lecture des données utilisateur:', error);
                    this.logout();
                }
            }

            bindEvents() {
                // Recherche et filtres
                document.getElementById('search-input').addEventListener('input', () => this.filterUsers());
                document.getElementById('role-filter').addEventListener('change', () => this.filterUsers());
                document.getElementById('status-filter').addEventListener('change', () => this.filterUsers());
                
                // Modal
                document.getElementById('close-modal').addEventListener('click', () => this.hideModal());
                document.getElementById('cancel-btn').addEventListener('click', () => this.hideModal());
                document.getElementById('user-form').addEventListener('submit', (e) => this.handleUserSubmit(e));
                
                // Pagination
                document.getElementById('prev-page').addEventListener('click', () => this.changePage(-1));
                document.getElementById('next-page').addEventListener('click', () => this.changePage(1));
                
                // Fermer la modal en cliquant à l'extérieur
                document.getElementById('user-modal').addEventListener('click', (e) => {
                    if (e.target.id === 'user-modal') {
                        this.hideModal();
                    }
                });
            }

            async loadUsers() {
                this.showLoading();
                
                try {
                    const token = localStorage.getItem('token');
                    const response = await fetch('/api/admin/users?limit=100', {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success && data.data) {
                            this.users = data.data.users;
                            this.filteredUsers = [...this.users];
                            this.renderUsers();
                            this.updateStats();
                        } else {
                            throw new Error(data.message || 'Erreur lors du chargement');
                        }
                    } else {
                        throw new Error('Erreur serveur');
                    }
                } catch (error) {
                    console.error('Erreur lors du chargement des utilisateurs:', error);
                    this.showError('Erreur lors du chargement des utilisateurs');
                }
            }

                        telephone: '01 76 54 32 10',
                        role: 'recruteur',
                        created_at: '2023-12-28T12:30:00Z',
                        last_login: '2024-01-14T11:15:00Z',
                        status: 'active'
                    }
                ];
            }

            renderUsers() {
                const container = document.getElementById('users-list');
                
                if (this.filteredUsers.length === 0) {
                    container.innerHTML = `
                        <div class="no-results">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="8.5" cy="7" r="4"></circle>
                                <line x1="20" y1="8" x2="20" y2="14"></line>
                                <line x1="23" y1="11" x2="17" y2="11"></line>
                            </svg>
                            <h3>Aucun utilisateur trouvé</h3>
                            <p>Aucun utilisateur ne correspond à vos critères de recherche.</p>
                        </div>
                    `;
                    return;
                }

                const startIndex = (this.currentPage - 1) * this.itemsPerPage;
                const endIndex = startIndex + this.itemsPerPage;
                const pageUsers = this.filteredUsers.slice(startIndex, endIndex);
                
                container.innerHTML = pageUsers.map(user => {
                    const roleClass = `role-${user.role}`;
                    const initials = user.nom.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                    
                    return `
                        <div class="user-card ${roleClass}">
                            <div class="user-header">
                                <div class="user-info">
                                    <div class="user-avatar">${initials}</div>
                                    <div class="user-details">
                                        <h3>${user.nom}</h3>
                                        <p>${user.email}</p>
                                    </div>
                                </div>
                                <span class="user-role ${roleClass}">${this.getRoleLabel(user.role)}</span>
                            </div>
                            <div class="user-meta">
                                <div class="meta-item">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                                    </svg>
                                    ${user.telephone || 'Non renseigné'}
                                </div>
                                <div class="meta-item">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                    Inscrit le ${new Date(user.created_at).toLocaleDateString('fr-FR')}
                                </div>
                                <div class="meta-item">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12,6 12,12 16,14"></polyline>
                                    </svg>
                                    Dernière connexion ${new Date(user.last_login).toLocaleDateString('fr-FR')}
                                </div>
                                <div class="meta-item">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                        <polyline points="22,4 12,14.01 9,11.01"></polyline>
                                    </svg>
                                    Statut: ${this.getStatusLabel(user.status)}
                                </div>
                            </div>
                            <div class="user-actions">
                                <button class="btn btn-secondary btn-sm" onclick="userManager.editUser(${user.id})">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                    Modifier
                                </button>
                                ${user.status === 'active' ? `
                                    <button class="btn btn-warning btn-sm" onclick="userManager.suspendUser(${user.id})">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="6" y="4" width="4" height="16"></rect>
                                            <rect x="14" y="4" width="4" height="16"></rect>
                                        </svg>
                                        Suspendre
                                    </button>
                                ` : `
                                    <button class="btn btn-success btn-sm" onclick="userManager.activateUser(${user.id})">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polygon points="5,3 19,12 5,21"></polygon>
                                        </svg>
                                        Activer
                                    </button>
                                `}
                                <button class="btn btn-danger btn-sm" onclick="userManager.deleteUser(${user.id})">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3,6 5,6 21,6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                    Supprimer
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                this.updatePagination();
            }

            updateStats() {
                const totalUsers = this.users.length;
                const candidats = this.users.filter(u => u.role === 'candidat').length;
                const recruteurs = this.users.filter(u => u.role === 'recruteur').length;
                const admins = this.users.filter(u => u.role === 'administrateur').length;

                document.getElementById('total-users').textContent = totalUsers;
                document.getElementById('candidats-count').textContent = candidats;
                document.getElementById('recruteurs-count').textContent = recruteurs;
                document.getElementById('admins-count').textContent = admins;
            }

            updatePagination() {
                const totalPages = Math.ceil(this.filteredUsers.length / this.itemsPerPage);
                const pagination = document.getElementById('pagination');
                const pageInfo = document.getElementById('page-info');
                const prevBtn = document.getElementById('prev-page');
                const nextBtn = document.getElementById('next-page');

                if (totalPages <= 1) {
                    pagination.style.display = 'none';
                    return;
                }

                pagination.style.display = 'flex';
                pageInfo.textContent = `Page ${this.currentPage} sur ${totalPages}`;
                
                prevBtn.disabled = this.currentPage === 1;
                nextBtn.disabled = this.currentPage === totalPages;
            }

            changePage(direction) {
                const totalPages = Math.ceil(this.filteredUsers.length / this.itemsPerPage);
                const newPage = this.currentPage + direction;

                if (newPage >= 1 && newPage <= totalPages) {
                    this.currentPage = newPage;
                    this.renderUsers();
                }
            }

            filterUsers() {
                const searchTerm = document.getElementById('search-input').value.toLowerCase();
                const roleFilter = document.getElementById('role-filter').value;
                const statusFilter = document.getElementById('status-filter').value;
                
                this.filteredUsers = this.users.filter(user => {
                    if (searchTerm && !user.nom.toLowerCase().includes(searchTerm) && !user.email.toLowerCase().includes(searchTerm)) {
                        return false;
                    }
                    if (roleFilter && user.role !== roleFilter) {
                        return false;
                    }
                    if (statusFilter && user.status !== statusFilter) {
                        return false;
                    }
                    return true;
                });

                this.currentPage = 1;
                this.renderUsers();
            }

            getRoleLabel(role) {
                const roleLabels = {
                    'candidat': 'Candidat',
                    'recruteur': 'Recruteur',
                    'administrateur': 'Administrateur'
                };
                return roleLabels[role] || role;
            }

            getStatusLabel(status) {
                const statusLabels = {
                    'active': 'Actif',
                    'inactive': 'Inactif',
                    'suspended': 'Suspendu'
                };
                return statusLabels[status] || status;
            }

            addUser() {
                this.currentUserId = null;
                document.getElementById('modal-title').textContent = 'Ajouter un utilisateur';
                document.getElementById('user-form').reset();
                document.getElementById('user-password').required = true;
                document.getElementById('user-modal').style.display = 'flex';
            }

            editUser(userId) {
                const user = this.users.find(u => u.id === userId);
                if (!user) return;

                this.currentUserId = userId;
                document.getElementById('modal-title').textContent = 'Modifier un utilisateur';
                document.getElementById('user-name').value = user.nom;
                document.getElementById('user-email').value = user.email;
                document.getElementById('user-telephone').value = user.telephone || '';
                document.getElementById('user-role').value = user.role;
                document.getElementById('user-password').value = '';
                document.getElementById('user-password').required = false;
                document.getElementById('user-modal').style.display = 'flex';
            }

            hideModal() {
                document.getElementById('user-modal').style.display = 'none';
                this.currentUserId = null;
            }

            async handleUserSubmit(e) {
                e.preventDefault();
                
                const formData = {
                    nom: document.getElementById('user-name').value,
                    email: document.getElementById('user-email').value,
                    telephone: document.getElementById('user-telephone').value,
                    role: document.getElementById('user-role').value
                };

                const password = document.getElementById('user-password').value;
                if (password) {
                    formData.password = password;
                }

                try {
                    if (this.currentUserId) {
                        // Modifier un utilisateur
                        const userIndex = this.users.findIndex(u => u.id === this.currentUserId);
                        if (userIndex !== -1) {
                            this.users[userIndex] = { ...this.users[userIndex], ...formData };
                        }
                        this.showNotification('Utilisateur modifié avec succès', 'success');
                    } else {
                        // Ajouter un utilisateur
                        const newUser = {
                            id: Math.max(...this.users.map(u => u.id)) + 1,
                            ...formData,
                            created_at: new Date().toISOString(),
                            last_login: new Date().toISOString(),
                            status: 'active'
                        };
                        this.users.push(newUser);
                        this.showNotification('Utilisateur ajouté avec succès', 'success');
                    }
                    
                    this.hideModal();
                    this.filterUsers();
                    this.updateStats();
                } catch (error) {
                    console.error('Erreur lors de la sauvegarde de l\'utilisateur:', error);
                    this.showNotification('Erreur lors de la sauvegarde', 'error');
                }
            }

            async suspendUser(userId) {
                if (!confirm('Êtes-vous sûr de vouloir suspendre cet utilisateur ?')) return;

                try {
                    const userIndex = this.users.findIndex(u => u.id === userId);
                    if (userIndex !== -1) {
                        this.users[userIndex].status = 'suspended';
                        this.showNotification('Utilisateur suspendu', 'success');
                        this.filterUsers();
                        this.updateStats();
                    }
                } catch (error) {
                    console.error('Erreur lors de la suspension de l\'utilisateur:', error);
                    this.showNotification('Erreur lors de la suspension', 'error');
                }
            }

            async activateUser(userId) {
                try {
                    const userIndex = this.users.findIndex(u => u.id === userId);
                    if (userIndex !== -1) {
                        this.users[userIndex].status = 'active';
                        this.showNotification('Utilisateur activé', 'success');
                        this.filterUsers();
                        this.updateStats();
                    }
                } catch (error) {
                    console.error('Erreur lors de l\'activation de l\'utilisateur:', error);
                    this.showNotification('Erreur lors de l\'activation', 'error');
                }
            }

            async deleteUser(userId) {
                if (!confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ? Cette action est irréversible.')) return;

                try {
                    const userIndex = this.users.findIndex(u => u.id === userId);
                    if (userIndex !== -1) {
                        this.users.splice(userIndex, 1);
                        this.showNotification('Utilisateur supprimé', 'success');
                        this.filterUsers();
                        this.updateStats();
                    }
                } catch (error) {
                    console.error('Erreur lors de la suppression de l\'utilisateur:', error);
                    this.showNotification('Erreur lors de la suppression', 'error');
                }
            }

            showLoading() {
                document.getElementById('users-list').innerHTML = '<div class="loading">Chargement des utilisateurs...</div>';
            }

            showError(message) {
                document.getElementById('users-list').innerHTML = `
                    <div class="no-results">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <h3>Erreur</h3>
                        <p>${message}</p>
                    </div>
                `;
            }

            showNotification(message, type) {
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 1rem 1.5rem;
                    background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6'};
                    color: white;
                    border-radius: 8px;
                    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                    z-index: 1001;
                    animation: slideIn 0.3s ease;
                `;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.animation = 'fadeOut 0.3s ease';
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            }

            logout() {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                this.redirectToLogin();
            }

            redirectToLogin() {
                window.location.href = 'login.html';
            }

            redirectToDashboard() {
                const dashboardUrls = {
                    'candidat': 'dashboard-candidat.html',
                    'recruteur': 'dashboard-recruteur.html',
                    'administrateur': 'dashboard-admin.html'
                };
                const url = dashboardUrls[this.currentUser?.role] || 'login.html';
                window.location.href = url;
            }
        }

        // Initialiser l'application
        let userManager;
        document.addEventListener('DOMContentLoaded', function() {
            userManager = new UsersManager();
        });

        // Ajouter les animations CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes fadeOut {
                from {
                    opacity: 1;
                }
                to {
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
