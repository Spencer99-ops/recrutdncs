<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - RECRUTDNCS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 2.5rem;
            text-align: center;
        }

        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .login-body {
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            color: #374151;
            border: 2px solid #e5e7eb;
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: #d1d5db;
            transform: translateY(-1px);
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .success-message {
            background: #f0f9ff;
            color: #0284c7;
            border: 1px solid #bfdbfe;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }

        .back-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                margin: 0 1rem;
            }
            
            .login-header, .login-body {
                padding: 2rem 1.5rem;
            }
            
            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Connexion</h1>
                <p>Accédez à votre espace RECRUTDNCS</p>
            </div>
            
            <div class="login-body">
                <div id="error-message" class="message error-message"></div>
                <div id="success-message" class="message success-message"></div>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email professionnel</label>
                        <input type="email" id="email" name="email" required placeholder="exemple@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="login-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                                <polyline points="15 17 21 12 15 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span id="btn-text">Se connecter</span>
                        </button>
                        <button type="button" class="btn btn-outline" onclick="window.location.href='/'">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12,19 5,12 12,5"></polyline>
                            </svg>
                            Retour
                        </button>
                    </div>
                </form>
                
                <div class="back-link">
                    <p>Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page de connexion chargée');
            
            const loginForm = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            // S'assurer que le bouton est actif
            loginBtn.disabled = false;
            console.log('Bouton de connexion activé');
            
            // Gérer la soumission du formulaire
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                console.log('Formulaire soumis');
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                
                console.log('Email:', email);
                console.log('Password:', password.length > 0 ? '***' : '');
                
                // Validation des champs
                if (!email) {
                    showError('Veuillez entrer votre email');
                    return;
                }
                
                if (!password) {
                    showError('Veuillez entrer votre mot de passe');
                    return;
                }
                
                // Validation email
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showError('Veuillez entrer une adresse email valide');
                    return;
                }
                
                // Désactiver le bouton et montrer le chargement
                loginBtn.disabled = true;
                btnText.innerHTML = '<span class="loading"></span> Connexion...';
                
                try {
                    const response = await fetch(API_CONFIG.API_URL + 'api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });
                    
                    const data = await response.json();
                    console.log('Réponse API:', data);
                    console.log('Statut:', response.status);
                    
                    if (response.ok && data.message === 'Connexion réussie') {
                        // Sauvegarder le token et les infos utilisateur
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        
                        showSuccess('Connexion réussie ! Redirection...');
                        console.log('Redirection vers le dashboard pour le rôle:', data.user.role);
                        
                        // Rediriger vers le dashboard approprié
                        setTimeout(() => {
                            const dashboards = {
                                'candidat': '/dashboard-candidat.html',
                                'recruteur': '/dashboard-recruteur.html',
                                'administrateur': '/dashboard-admin.html'
                            };
                            
                            const dashboardUrl = dashboards[data.user.role] || '/dashboard.html';
                            console.log('URL de redirection:', dashboardUrl);
                            window.location.href = dashboardUrl;
                        }, 1000);
                    } else {
                        showError(data.message || 'Identifiants incorrects.');
                    }
                } catch (error) {
                    console.error('Erreur de connexion:', error);
                    showError('Erreur de connexion au serveur. Veuillez réessayer.');
                } finally {
                    // Réactiver le bouton
                    loginBtn.disabled = false;
                    btnText.textContent = 'Se connecter';
                }
            });
            
            // Fonctions utilitaires
            function showError(message) {
                hideMessages();
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }
            
            function showSuccess(message) {
                hideMessages();
                successMessage.textContent = message;
                successMessage.style.display = 'block';
            }
            
            function hideMessages() {
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
