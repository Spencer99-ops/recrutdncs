<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection Dashboard - RECRUTDNCS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .redirect-container {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        p {
            margin: 0;
            opacity: 0.8;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="spinner"></div>
        <h1>Redirection en cours...</h1>
        <p>Veuillez patienter pendant que nous vous dirigeons vers votre dashboard.</p>
    </div>

    <script>
        // Vérifier l'authentification et rediriger vers le bon dashboard
        function checkAuthAndRedirect() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            
            if (!token || !userStr) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const user = JSON.parse(userStr);
                const dashboardUrls = {
                    'candidat': 'dashboard-candidat.html',
                    'recruteur': 'dashboard-recruteur.html',
                    'administrateur': 'dashboard-admin.html'
                };
                
                const url = dashboardUrls[user.role] || 'dashboard-candidat.html';
                
                // Rediriger après une courte pause pour l'effet visuel
                setTimeout(() => {
                    window.location.href = url;
                }, 1500);
                
            } catch (error) {
                console.error('Erreur lors de la lecture des données utilisateur:', error);
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        }

        // Démarrer la redirection immédiatement
        checkAuthAndRedirect();
    </script>
</body>
</html>
