<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Offres - RecrutDNCS</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .filters-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .filter-group input,
        .filter-group select {
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .job-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .job-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .job-header {
            margin-bottom: 1rem;
        }

        .job-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 0.5rem 0;
        }

        .job-company {
            font-size: 1rem;
            color: #6b7280;
            margin: 0 0 0.5rem 0;
        }

        .job-location {
            font-size: 0.9rem;
            color: #6b7280;
            margin: 0;
        }

        .job-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .job-type {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .job-salary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .job-description {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .job-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
        }

        .job-date {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .job-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-apply {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-save {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .error {
            text-align: center;
            padding: 3rem;
            color: #ef4444;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: #f3f4f6;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            font-weight: 600;
            color: #374151;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }

            .jobs-grid {
                grid-template-columns: 1fr;
            }

            .job-footer {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
    <script src="js/config.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Offres d'Emploi</h1>
                <p style="color: #6b7280; margin-top: 0.5rem;">Découvrez les opportunités qui correspondent à votre profil</p>
            </div>
            <a href="dashboard-candidat.html" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Retour
            </a>
        </div>

        <div class="filters-section">
            <h2 style="margin-bottom: 1.5rem; color: #1f2937;">Filtres</h2>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="filter-search">Recherche</label>
                    <input type="text" id="filter-search" placeholder="Rechercher un poste...">
                </div>
                <div class="filter-group">
                    <label for="filter-location">Localisation</label>
                    <input type="text" id="filter-location" placeholder="Ville ou région...">
                </div>
                <div class="filter-group">
                    <label for="filter-contract">Type de contrat</label>
                    <select id="filter-contract">
                        <option value="">Tous les contrats</option>
                        <option value="CDI">CDI</option>
                        <option value="CDD">CDD</option>
                        <option value="Stage">Stage</option>
                        <option value="Alternance">Alternance</option>
                        <option value="Freelance">Freelance</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-salary">Salaire minimum</label>
                    <input type="number" id="filter-salary" placeholder="Salaire annuel (k$)">
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-secondary" onclick="resetFilters()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                        <path d="M20.93 11.08A9 9 0 1 1 12 3.07"></path>
                    </svg>
                    Réinitialiser
                </button>
                <button class="btn btn-primary" onclick="applyFilters()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    Rechercher
                </button>
            </div>
        </div>

        <div id="jobs-container">
            <div class="loading">Chargement des offres d'emploi...</div>
        </div>

        <div class="pagination" id="pagination">
            <!-- Pagination sera générée par JavaScript -->
        </div>
    </div>

    <script>
        // Variables globales
        let allJobs = [];
        let filteredJobs = [];
        let currentPage = 1;
        const jobsPerPage = 12;

        // Vérifier l'authentification
        function checkAuth() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            
            if (!token || !userStr) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const user = JSON.parse(userStr);
                if (user.role !== 'candidat') {
                    const dashboards = {
                        'recruteur': 'dashboard-recruteur.html',
                        'administrateur': 'dashboard-admin.html'
                    };
                    window.location.href = dashboards[user.role] || 'login.html';
                    return;
                }
            } catch (error) {
                console.error('Erreur lors de la lecture des données utilisateur:', error);
                logout();
            }
        }

        // Déconnexion
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // Charger les offres d'emploi depuis la base de données
        async function loadJobs() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(API_CONFIG.API_URL + 'api/jobs', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.data) {
                        // L'endpoint retourne data.data.jobs, pas data.data directement
                        allJobs = data.data.jobs || [];
                        filteredJobs = [...allJobs];
                        displayJobs();
                    } else {
                        throw new Error('Données invalides');
                    }
                } else {
                    throw new Error('Erreur serveur');
                }
            } catch (error) {
                console.error('Erreur lors du chargement des offres:', error);
                showMessage('Erreur lors du chargement des offres: ' + error.message, 'error');
                const container = document.getElementById('jobs-container');
                container.innerHTML = '<div class="error">Impossible de charger les offres d\'emploi</div>';
            }
        }

        // Charger des offres simulées en cas d'erreur
        function loadSimulatedJobs() {
            allJobs = [
                {
                    id: 1,
                    titre: 'Développeur Web Senior',
                    entreprise: 'TechCompany',
                    localisation: 'Paris',
                    type_contrat: 'CDI',
                    salaire: '45-60k',
                    description: 'Nous recherchons un développeur web senior expérimenté pour rejoindre notre équipe...',
                    created_at: '2024-01-15T10:30:00Z'
                },
                {
                    id: 2,
                    titre: 'Data Analyst',
                    entreprise: 'DataCorp',
                    localisation: 'Lyon',
                    type_contrat: 'CDI',
                    salaire: '40-55k',
                    description: 'Poste de data analyst pour analyser et interpréter les données de notre entreprise...',
                    created_at: '2024-01-10T14:20:00Z'
                },
                {
                    id: 3,
                    titre: 'UX Designer',
                    entreprise: 'DesignStudio',
                    localisation: 'Marseille',
                    type_contrat: 'CDD',
                    salaire: '35-45k',
                    description: 'Designer UX pour créer des interfaces utilisateur exceptionnelles...',
                    created_at: '2024-01-05T09:15:00Z'
                },
                {
                    id: 4,
                    titre: 'Marketing Manager',
                    entreprise: 'MarketPro',
                    localisation: 'Paris',
                    type_contrat: 'CDI',
                    salaire: '50-70k',
                    description: 'Manager marketing pour développer nos stratégies commerciales...',
                    created_at: '2024-01-12T11:45:00Z'
                },
                {
                    id: 5,
                    titre: 'Développeur Mobile',
                    entreprise: 'AppTech',
                    localisation: 'Lille',
                    type_contrat: 'CDI',
                    salaire: '42-58k',
                    description: 'Développeur mobile pour créer des applications iOS et Android...',
                    created_at: '2024-01-08T16:30:00Z'
                }
            ];
            filteredJobs = [...allJobs];
            displayJobs();
        }

        // Afficher les offres d'emploi
        function displayJobs() {
            const container = document.getElementById('jobs-container');
            const startIndex = (currentPage - 1) * jobsPerPage;
            const endIndex = startIndex + jobsPerPage;
            const jobsToDisplay = filteredJobs.slice(startIndex, endIndex);

            if (jobsToDisplay.length === 0) {
                container.innerHTML = '<div class="no-results">Aucune offre d\'emploi trouvée</div>';
                return;
            }

            const jobsHTML = jobsToDisplay.map(job => `
                <div class="job-card" onclick="viewJobDetails(${job.id})">
                    <div class="job-header">
                        <h3 class="job-title">${job.titre}</h3>
                        <p class="job-company">${job.entreprise}</p>
                        <p class="job-location"> ${job.localisation}</p>
                    </div>
                    <div class="job-meta">
                        <span class="job-type">${job.type_contrat}</span>
                        <span class="job-salary">${job.salaire}</span>
                    </div>
                    <p class="job-description">${job.description}</p>
                    <div class="job-footer">
                        <span class="job-date">Publié le ${new Date(job.created_at).toLocaleDateString('fr-FR')}</span>
                        <div class="job-actions">
                            <button class="btn-apply" onclick="applyToJob(event, ${job.id})">Postuler</button>
                            <button class="btn-save" onclick="saveJob(event, ${job.id})">Sauvegarder</button>
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="jobs-grid">${jobsHTML}</div>`;
            updatePagination();
        }

        // Mettre à jour la pagination
        function updatePagination() {
            const totalPages = Math.ceil(filteredJobs.length / jobsPerPage);
            const paginationContainer = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let paginationHTML = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15,18 9,12 15,6"></polyline>
                    </svg>
                </button>
                <span class="page-info">Page ${currentPage} sur ${totalPages}</span>
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9,18 15,12 9,6"></polyline>
                    </svg>
                </button>
            `;

            paginationContainer.innerHTML = paginationHTML;
        }

        // Changer de page
        function changePage(page) {
            const totalPages = Math.ceil(filteredJobs.length / jobsPerPage);
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            displayJobs();
        }

        // Appliquer les filtres
        function applyFilters() {
            const searchTerm = document.getElementById('filter-search').value.toLowerCase();
            const location = document.getElementById('filter-location').value.toLowerCase();
            const contract = document.getElementById('filter-contract').value;
            const salary = document.getElementById('filter-salary').value;

            filteredJobs = allJobs.filter(job => {
                const matchSearch = !searchTerm || 
                    job.titre.toLowerCase().includes(searchTerm) || 
                    job.description.toLowerCase().includes(searchTerm);
                
                const matchLocation = !location || 
                    job.localisation.toLowerCase().includes(location);
                
                const matchContract = !contract || job.type_contrat === contract;
                
                const matchSalary = !salary || 
                    (job.salaire && parseInt(job.salaire.split('-')[0]) >= parseInt(salary));

                return matchSearch && matchLocation && matchContract && matchSalary;
            });

            currentPage = 1;
            displayJobs();
        }

        // Réinitialiser les filtres
        function resetFilters() {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-location').value = '';
            document.getElementById('filter-contract').value = '';
            document.getElementById('filter-salary').value = '';
            
            filteredJobs = [...allJobs];
            currentPage = 1;
            displayJobs();
        }

        // Voir les détails d'une offre
        function viewJobDetails(jobId) {
            window.location.href = `jobs.html?id=${jobId}`;
        }

        // Postuler à une offre
        async function applyToJob(event, jobId) {
            event.stopPropagation();
            
            try {
                const token = localStorage.getItem('token');
                const user = JSON.parse(localStorage.getItem('user'));
                
                const response = await fetch(API_CONFIG.API_URL + 'api/applications', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        job_id: jobId,
                        user_id: user.id
                    })
                });

                if (response.ok) {
                    showMessage('Candidature envoyée avec succès !', 'success');
                } else {
                    showMessage('Erreur lors de l\'envoi de la candidature', 'error');
                }
            } catch (error) {
                console.error('Erreur lors de la candidature:', error);
                showMessage('Erreur lors de l\'envoi de la candidature', 'error');
            }
        }

        // Sauvegarder une offre
        async function saveJob(event, jobId) {
            event.stopPropagation();
            
            try {
                const token = localStorage.getItem('token');
                const user = JSON.parse(localStorage.getItem('user'));
                
                const response = await fetch(API_CONFIG.API_URL + 'api/candidate/save-job', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        jobId: jobId
                    })
                });

                if (response.ok) {
                    showMessage('Offre sauvegardée avec succès !', 'success');
                } else {
                    showMessage('Erreur lors de la sauvegarde de l\'offre', 'error');
                }
            } catch (error) {
                console.error('Erreur lors de la sauvegarde:', error);
                showMessage('Erreur lors de la sauvegarde de l\'offre', 'error');
            }
        }

        // Afficher un message
        function showMessage(message, type) {
            const messageEl = document.createElement('div');
            messageEl.className = `message message-${type}`;
            messageEl.textContent = message;
            
            document.body.appendChild(messageEl);
            
            setTimeout(() => {
                messageEl.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    if (document.body.contains(messageEl)) {
                        document.body.removeChild(messageEl);
                    }
                }, 300);
            }, 3000);
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadJobs();
        });
    </script>
</body>
</html>
